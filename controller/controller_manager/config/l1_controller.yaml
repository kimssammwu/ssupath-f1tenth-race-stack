l1_controller:
  ros__parameters:
    t_clip_min: 0.1
    t_clip_max: 6.0
    # m_l1: 0.583
    # q_l1: -0.167
    m_l1: 0.32 #기존 0.4 
    # 0715 위빙(1.8Hz 조향 진동) 완화: lookahead 연장으로 루프 이득 저감 (0.4 -> 0.7)
    q_l1: 0.25   #기존 0.3
    speed_lookahead: 0.0
    lat_err_coeff: 0.4 #기존 0.4
    # acc_scaler_for_steer_safe: 1.2
    # dec_scaler_for_steer_safe: 0.9 
    # acc_scaler_for_steer_aggressive: 1.1
    # 0715 위빙 완화: 가속 부호 따라 조향 이득이 1.0/1.1/1.2로 널뛰던 것 제거
    acc_scaler_for_steer: 1.0
    dec_scaler_for_steer: 1.0
    # start_scale_speed: 7.0
    # end_scale_speed: 8.0

    start_scale_speed: 5.0
    end_scale_speed: 7.0
    # downscale_factor: 0.05
    downscale_factor: 0.05

    # increasing this to 0.20 AT MOST can make the car faster on the laptime but cut more corners
    speed_lookahead_for_steer: 0.04 # safe/agg 0.0/0.175

    ## Acceleration Based Velocity Controller Parameters
    vel_accel_mode: False
    vel_ctr_p_gain: 8.0
    vel_ctr_i_gain: 0.0
    vel_ctr_d_gain: 0.5

    ## Trailing Controller Parameters
    allow_accel_trailing: False
    trailing_mode: True #True = Distance, False = Time
    prioritize_dyn: True
    trailing_gap: 2.5 # Distance in meters or gap in seconds, depending on mode
    # trailing_p_gain: 1.0
    trailing_p_gain: 0.3
    trailing_i_gain: 0.0
    trailing_d_gain: 0.2
    blind_trailing_speed: 0.5

    trailing_to_gbtrack_speed_scale: 0.3 # trailing to gbtrack 상태에서 속도 스케일링 계수 (0.0~1.0) -> speed_scale.yaml의 speed scale이 적용된 값에 이 값이 추가 적용되는 것



    # 11.21 파라미터

    # speed_adjust_lat_err 함수 참고
    curvature_scale: 1.0

    # speed_adjust_heading 함수 참고
    ok_thresh: 20.0 #heading error 최대 허용치 (deg)
    hard_thresh: 90.0 #최대 heading error (이 이상의 heading error에는 동일한 패널티 적용) (deg)
    min_scale: 0.8 # 최대 패널티 (80%의 감속된 속도로 주행)

    # calc_steering_angle 함수 참고
    steer_rate_thresh: 0.4 #조향 변화량 임계치

    # ---- 횡오차 기준 / 횡오차 보정 항 (2026-08-21 신규, PP 전용) -----------
    # 배경: obs_debug_0821_2001 실측에서 "경로는 잘 만드는데 차가 못 따라간다" 의
    # 원인이 접지도 연산량도 아니었다. 5 m/s 에서 0.3 m 벗어난 뒤 1초가 지나도
    # 오차가 105% 남아 있었는데, 그때 접지력은 3.4 m/s^2 남아 있었고 조향 명령은
    # 0.032 rad(2도)뿐이었다. 못 간 게 아니라 조향을 안 넣은 것이다.
    #
    # [1] lat_err_from_path
    #   컨트롤러가 말하는 "횡오차"를 무엇으로 볼지.
    #     true  = 지금 따라가는 경로(local waypoints)까지의 거리   <- 신규 기본
    #     false = 예전 동작. |frenet d| = 레이싱라인까지의 거리.
    #   예전 동작은 회피 중에 역효과다. 회피란 레이싱라인을 일부러 벗어나는 것인데,
    #   그 거리가 (1) lookahead 하한(sqrt(2)*e)을 밀어올리고 (2) 속도를 깎는다.
    #   실측: 회피 중 |frenet d| 중앙 0.28 m / p90 0.92 m 인데 실제 경로 기준
    #   오차는 중앙 0.14 m. lookahead 가 덮어써진 비율이 전역주행 1% 대 회피 23% 로,
    #   m_l1/q_l1 튜닝이 정작 필요한 회피 구간에서만 무효화되고 있었다.
    #   ※ 전역주행 중에는 local waypoints 가 곧 레이싱라인이라 값이 거의 같다.
    #     즉 이 변경은 회피 거동만 바꾼다.
    #   ※ 부작용: "레이싱라인에서 멀면 감속" 이라는 원래 의도(타임트라이얼용)는
    #     사라진다. 되돌리려면 false.
    lat_err_from_path: true
    #
    # [2] ct_gain — 횡오차 보정 항 (Stanley 형)
    #   조향 += atan2(ct_gain * 경로까지_부호거리, max(v, ct_v_min))
    #   순수추종 조향은 lookahead 의 제곱에 반비례해 약해진다(~2*L*e/L1^2). 그래서
    #   위빙을 줄이려 lookahead 를 늘리면 경로 복귀력이 급격히 사라지고, 복귀력을
    #   얻으려 줄이면 위빙이 온다(조향 지연 t63 125 ms 때문에 필연이다).
    #   이 항은 경로 위에 있으면 정확히 0 이라 전역주행 위빙에 기여하지 않고,
    #   벗어났을 때만 작용한다 -> lookahead 를 건드리지 않고 복귀만 빨라진다.
    #
    #   0.0 = 완전히 끔(= 이 변경 전과 동일한 조향). 실차에서는 0.3 부터 올릴 것.
    #   ct_gain 0.5, 오차 0.5 m 기준 필요 횡가속도:
    #       2 m/s 1.5 / 3 m/s 2.3 / 5 m/s 3.8 m/s^2   (실측 접지 한계 5.3)
    #   1.0 으로 올리면 5 m/s 에서 7.8 m/s^2 라 한계를 넘는다. 0.6 을 넘기지 말 것.
    ct_gain: 0.0
    ct_max_rad: 0.15   # [rad] 이 항이 더할 수 있는 조향의 절대 상한 (약 8.6도)
    ct_v_min: 1.0      # [m/s] 나눗셈에 쓰는 속도 하한. 저속에서 과조향 방지
    
    # ---- 정지 복구(후진) ----------------------------------------------------
    # state_machine 이 StateType.RECOVER 를 낼 때만 쓰인다 (PP 모드 전용).
    # 상태머신이 '차에서 가장 가까운 중심선 점 -> 뒤쪽' 순서의 웨이포인트를 음수 속도로
    # 보내면, PP 가 후방 lookahead 로 후진 pure pursuit 조향을 만든다.
    # 후진 거리/속도/타임아웃 자체는 state_machine_params.yaml 쪽에서 정한다.
    reverse_l1_dist: 0.7      # [m] 후방 lookahead. 짧으면 흔들리고 길면 중심선 수렴이 느리다
    reverse_speed_max: 2.0    # [m/s] 후진 속도 크기 상한. state_machine 의 recover_speed_mps 와 맞출 것
    reverse_steer_max: 0.32   # [rad] 후진 중 조향각 상한 (약 18도). 좁은 트랙에서 뒷부분이 벽에 닿지 않게
    reverse_stale_cycles: 20  # 로컬 웨이포인트가 이 사이클 수만큼 갱신 안 되면 정지 (40Hz 기준 0.5초)

mux_controller:
  ros__parameters:
    # 메인 루프 주기 [Hz]
    loop_rate_hz: 40.0

    # JOY <-> AUTO 전환 토글 버튼 (0-based index)
    joy_toggle_button_idx: 5

    # Sony Wireless Controller 기준:
    #   기존 사용: L1=4(deadman), R1=5(JOY/AUTO toggle)
    #   추가 사용: Circle=2(e-stop latch), Triangle=3(release)
    joy_estop_enabled: true
    joy_estop_button_idx: 2
    joy_estop_release_button_idx: 3

    # AUTO start gate:
    #   X/Cross(idx 1)을 누르고 있는 동안 AUTO 명령을 정지/중앙정렬로 막고,
    #   떼는 순간 AUTO 명령을 다시 허용한다.
    #   O/Triangle e-stop은 비상정지용으로 그대로 유지한다.
    start_hold_enabled: true
    start_hold_button_idx: 1
    start_hold_servo_position: 0.5

    # 외부 e-stop 토픽 (stack_master 의 mouse_estop 노드 = 마우스 우클릭 토글).
    # 조이스틱 e-stop 과 같은 래치를 공유하므로 마우스로 세우고 조이스틱으로 풀 수 있다.
    # joy_estop_enabled: false 로 두어도 이 토픽은 계속 동작한다 (버튼만 꺼진다).
    estop_topic: "/e_stop"
    estop_state_topic: "/e_stop_state"

    # AUTO -> JOY 전환 시 정지 펄스 시간 [ms]
    joy_stop_dwell_ms: 300

    # MPCC -> PP 전환 조건 (not solve 연속 5번)
    mpcc_hist_len: 5

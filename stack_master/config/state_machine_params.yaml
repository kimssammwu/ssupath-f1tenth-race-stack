state_machine:
  ros__parameters:
    rate_hz: 40  # [hz]
    initial_state: 'GB_TRACK'  # "GB_TRACK", ...
    test_on_car: True  # also set True if using on a bag
    # 로컬 웨이포인트 개수 (0.1 m 간격) = 컨트롤러가 보는 경로 길이.
    # _fuse_speed_from_global 의 역방향 감속 패스가 이 배열 안에서만 돌기 때문에
    # 이 값이 곧 "미리 감속할 수 있는 최대 거리"이기도 하다.
    # 2026-08-04: 110(11m)으로 올렸다가 원복. 퍼셉션이 passthrough 박스 때문에
    # 7 m 밖을 아예 못 보므로(아래 gb_horizon_m 주석 참조) 미리 감속할 거리를 늘려도
    # 그 거리에 장애물 정보가 없다. 브레이크만 이르게 걸려 주행이 굼떠졌다.
    n_loc_wpnts: 70  # number of local waypoints published, 1 waypoints every 0.1 meter

    volt_threshold: 11. # [V] voltage threshold below which we start screaming

    force_state: False  # force state to be the one specified in force_state_choice


    splini_ttl: 3. # [s] ttl counter for validity of spliner waypoints -> NOW DYNAMIC RECONFIGURABLE

    gb_ego_width_m: 0.4 # [m], distance from gb path for rejoining 
    # [m] 장애물 '표면' 에서 이만큼 안으로 들어오면 전방이 막힌 것으로 보고 감속한다.
    #     판정식: |obs.d_center| < obs.size/2 + lateral_width_gb_m   (_check_gbfree)
    #
    # ★ 2026-08-22: 의미가 바뀌었다. 예전에는 장애물 크기를 안 세고 중심 d 만 이 값과
    #   비교했다(= '레이스라인 기준 코리도 반폭'). 지금은 lateral_width_ot_m 과 같은 꼴,
    #   즉 '장애물 표면에서의 여유' 다. 그래서 값도 0.8 -> 0.30 으로 내렸다.
    #   그냥 0.8 을 두면 예전보다 훨씬 넓어져서 온 트랙이 감속 대상이 된다.
    #
    # 실측 (obs_debug_0822_2017, 전방 6.9 m 안 장애물-프레임 21620개.
    #       '놓친 충돌' = 레이스라인 그대로 가면 실제로 겹치는데 감속을 안 하는 경우):
    #     구 규칙 |d| < 0.80         : 감속 85.1%  놓침 0  (그중 45.0% 가 불필요했다)
    #     |d| < size/2 + 0.50        : 감속 80.6%  놓침 0
    #     |d| < size/2 + 0.35        : 감속 66.6%  놓침 0
    #     |d| < size/2 + 0.30        : 감속 62.2%  놓침 0   <- 채택
    #     |d| < size/2 + 0.25        : 감속 58.8%  놓침 0
    #     |d| < size/2 + 0.20        : 감속 54.2%  놓침 0
    #   0.25 밑도 이 백에서는 놓친 충돌이 0 이지만, 차체 반폭이 0.14 라 여유가 0.1 m 밖에
    #   안 남는다. 퍼셉션 오차(회전 왜곡: 3 m 지점 p90 0.49 m)를 감안해 0.30 을 골랐다.
    #   감속이 여전히 잦으면 0.25 까지는 내려도 이 백 기준 안전 손실이 없다.
    #
    # ※ 같은 값이 _check_recover_path_free(후진 전 후방 장애물 검사)에도 쓰인다.
    lateral_width_gb_m: 0.20 # -> NOW DYNAMIC RECONFIGURABLE #레이스라인으로부터 감속하는 횡폭
    # TRAILING(=감속) 진입 거리.
    # ★ 2026-08-04: 10.0 으로 올렸다가 원복. 이 값을 올려도 소용이 없다 —
    #   퍼셉션의 진짜 상한은 passthrough_filter_node.param.yaml 의 크롭 박스
    #   (x[-4,4] y[-7,0]) 라서 **전방 7 m 밖의 점군은 존재조차 하지 않는다.**
    #   obs_debug_0804_1612 실측: cluster_to_obstacle 출력의 최대 전방거리 7.77 m
    #   (박스 모서리 sqrt(4^2+7^2)=8.06 m 와 일치), 7 m 초과 검출 0.9%.
    #   즉 7 m 를 넘는 horizon 은 전부 빈 공간을 가리킨다. 늘리려면 크롭 박스부터.
    gb_horizon_m: 6.9 # [m] horizon considered for the global waypoints to check for obstacles
    overtaking_horizon_m: 6.9 # [m] horizon considered for overtaking

    # [m] 회피선이 장애물 "표면"에서 최소한 확보해야 하는 여유. (ego 반차폭 0.14 + 알파)
    # _check_ofree 는 |ot_d - obs_d| < obs.size/2 + 이 값 이면 회피 불가로 본다.
    # 0.1 이던 시절엔 장애물 반폭조차 안 세서 장애물을 뚫는 회피선도 전부 승인됐다.
    # 반대로 너무 크면 graph_planner 가 좁은 구간에서 여유를 완화해 만든 정상 경로를
    # 여기서 거부해버린다. 반드시 아래 구간 안에 둘 것:
    #   veh_width/2 (=0.14, 실제 충돌) < 이 값 < veh_width/2 + min_safety_margin (=0.19)
    # veh_width(offline_params.yaml) 나 min_safety_margin 을 바꾸면 이 값도 같이 봐야 한다.
    lateral_width_ot_m: 0.17 # -> NOW DYNAMIC RECONFIGURABLE
    # splini_hyst_timer_sec: 0.2 # [s] time we have to wait between switching from overtaking on one side to the other -> NOW DYNAMIC RECONFIGURABLE
    splini_hyst_timer_sec: 0.4

    ftg_threshold_speed: 0.1 # [m/s] speed threshold below which we start a timer for activating FTG
    ftg_timer_sec: 3. # [s] time we have to stay slower than the `ftg_threshold_speed` threshold before we activate FTG

    Trailing_to_GBtrack_counting_threshold: 0 # [count] number of consecutive times we have to see gb_free to switch from TRAILING to GB_TRACK (0~500) -> 40hz 일때 count 40개당 1초

    # 회피 궤적(TRAILING / OVERTAKE)의 속도 상한을 거는 접지 한계.
    # 회피선은 레이싱라인보다 훨씬 굽어 있어서 전역 속도를 그대로 쓰면 필요 횡가속도가
    # 접지 한계를 몇 배 넘어간다 -> 차가 못 돌고 직진해서 장애물을 들이받는다(고속 직선에서 특히).
    #   v <= sqrt(ay_max / |kappa|) 로 제한하고, ax_max 로 미리 감속한다.
    # offline_params.yaml 의 ax_max / ay_max 와 같은 값으로 유지할 것.
    # 실차에서 회피 중 밀리면(언더스티어) ay_max 를 낮춰라. mu 1.0 기준값이라 낙관적이다.
    ay_max_mps2: 4.0 # [m/s^2] 최대 횡가속도   # 5.4
    ax_max_mps2: 2.5 # [m/s^2] 최대 종가속도(감속) # 3.8

    # ---- 고속 회피 감속 강화 (2026-08-04 신규) --------------------------------
    # 회피 궤적(TRAILING/OVERTAKE)의 속도에 곱하는 '추가' 배율을 현재 속도에 따라 바꾼다.
    # 왜 필요한가: obs_debug_0804_1657 실측에서 5 m/s 이상일 때 장애물이 평균 3.72 m
    # 앞에서야 확정된다(충돌까지 0.7초). 제동 지연 0.2초를 빼면 실제 감속 구간은 0.5초뿐이라
    # 초반에 최대한 속도를 깎아야 그 뒤 횡방향으로 비킬 시간이 남는다.
    # 저속에서는 이미 잘 피하므로 건드리면 손해다 -> v_lo 이하에서는 정확히 1.0 이 되도록 설계.
    #
    #   cur_vs <= hs_brake_v_lo          -> 배율 1.0        (기존 거동 그대로)
    #   cur_vs >= hs_brake_v_hi          -> 배율 hs_brake_factor
    #   그 사이                           -> 선형 보간
    #
    # 기능을 끄려면 hs_brake_factor 를 1.0 으로 두면 된다(계산 자체를 건너뛴다).
    # 최종 명령속도 = 전역속도 x (상태별 배율: TRAILING 1.0 / OVERTAKE 0.8) x 이 배율,
    # 그 뒤 곡률한계(ay_max)와 역방향 감속패스(ax_max)가 추가로 걸린다.
    #
    # 2026-08-04 obs_debug_0804_2015 검증 결과 (factor 0.6 으로 주행):
    #   회피 상태(TRAILING/OVERTAKE)에서 로컬목표/전역속도 비 =
    #     0~2 m/s 0.88 / 2~3 m/s 0.77 / 3~4 m/s 0.68 / 4~5 m/s 0.76
    #   -> 속도가 오를수록 비가 낮아지므로 **로직은 정상 동작 중**이다.
    #   제동 권한도 충분하다: >4.5 m/s 에서 감속 요구 시 1초 뒤 실제 -2.32 m/s.
    #   그런데 5 m/s 이상 구간의 상태는 GB_TRACK 100% 였다. 즉 그 속도대에서는
    #   애초에 회피 상태로 들어가지 않아 이 배율이 발동할 기회조차 없다.
    #   -> 남은 개선 여지는 3~5 m/s 구간을 더 깊게 깎는 것이라 factor 를 0.6 -> 0.45.
    #
    # ★ 2026-08-20 재조정 (2.5/3.5/0.45 -> 3.0/4.5/0.6). 이유:
    #   obs_debug_0820_1446(79초) 실측에서 회피 경로 속도가 전반적으로 느린 원인을 분해했더니
    #   OVERTAKE 의 scaled->local 배율 0.743 중 상태배율이 0.774, 곡률한계+ax 는 0.993 이었다.
    #   상태배율의 하드코딩 0.8 을 ot_speed_scaling(=1.0)으로 풀고 나면 **다음 병목이 이 배율**이다.
    #   이 배율은 '현재' 속도(cur_vs)로 계산되는 되먹임 감속이라 속도 상한을 만든다:
    #     명령 = v_glob x factor(v) 이므로 v_glob=2.78 일 때 평형이 약 2.65 m/s 에서 잡힌다.
    #     (v=2.75 -> factor 0.863 -> 명령 2.40 -> 감속) 즉 전역속도를 아무리 올려도
    #     회피 상태에서는 2.5~2.7 m/s 근처에 눌린다.
    #   v_lo 를 3.0 으로 올리면 지금 실제 주행 속도대(2~3 m/s)에서 감속이 아예 안 걸리고,
    #   3.0 이상에서만 점진적으로 걸린다.
    #
    #   ※ 트레이드오프를 분명히 해 둔다. 원래 0.45 는 2026-08-04 에 "3~5 m/s 구간을 더 깊게
    #     깎자"는 근거로 0.6 에서 내린 값이다. 지금 3.0/4.5/0.6 으로 되돌리면 그 구간의
    #     제동 여유가 줄어든다. 회피 중 장애물에 늦게 반응한다고 판단되면 되돌릴 값은
    #     이 세 줄뿐이다(코드 변경 불필요). 완전 비활성은 hs_brake_factor: 1.0.
    hs_brake_v_lo: 3.0     # [m/s] 이 속도 이하에서는 감속 강화 없음. 이전값 2.5
    hs_brake_v_hi: 4.5     # [m/s] 이 속도 이상에서는 hs_brake_factor 를 그대로 적용. 이전값 3.5
    hs_brake_factor: 0.6   # [-] 고속에서 곱할 배율 (1.0 = 비활성). 이전값 0.45

    # 회피 궤적(OVERTAKE)에 곱하는 배율. 1.0 = 회피선을 스케일링된 전역속도 그대로 명령.
    #
    # 예전에는 states.Overtaking 안에 0.8 로 하드코딩돼 있었다(주석에 "아직 파라미터로 안 만들었음"
    # 이라고 적혀 있던 그 값). obs_debug_0820_1446 실측 결과 회피 경로가 느린 원인이 사실상
    # 이 상수 하나였고(곡률한계는 배열의 2.7%, ax 감속은 1.2% 지점에서만 걸림) 물리 제약이
    # 아니었으므로 1.0 으로 푼다.
    #
    # 접지 보호는 이 값이 아니라 위의 ay_max_mps2(곡률한계)와 ax_max_mps2(역방향 감속 패스)가
    # 담당한다. 회피 중 차가 바깥으로 밀리면 여기를 내리지 말고 ay_max_mps2 를 내려라 —
    # 그래야 굽은 구간만 느려지고 직선 회피 구간 속도는 유지된다.
    ot_speed_scaling: 0.9  # [-] 이전 거동으로 되돌리려면 0.8


    # ---- 정지 복구(후진) ------------------------------------------------------
    # 로컬 플래너가 해를 못 내서(otwpnts 빈 배열) TRAILING 에 갇혀 제자리에 멈춰 있을 때,
    # 중심선 웨이포인트를 따라 recover_distance_m 만큼 뒤로 물러난 뒤 다시 기존 로직을 태운다.
    # 근본 원인(graph_planner 가 통로가 살아 있는데도 경로를 통째로 폐기)을 고치는 게 아니라
    # 레이싱 중 영구 정지를 막는 탈출 수단이다. 자세한 원인 분석은 graph_planner 쪽 기록 참고.
    #
    # ★ 후방 센싱이 없다: passthrough_filter_node.param.yaml 크롭이 y[-7, 0] (전방만)이라
    #   /perception/obstacles 에도 /scan 에도 차 뒤 정보가 없다. 즉 후진은 맹목 주행이다.
    #   그래서 (1) 거리를 1.5 m 로 짧게 (2) 속도를 0.8 m/s 로 낮게 (3) 중심선 d_left/d_right
    #   기하 검사로 트랙 안쪽인지 확인 (4) 타임아웃, 이 네 가지로만 안전을 확보한다.
    #   후진 중 조이스틱 개입(R1 토글 / Circle e-stop)은 mux_controller 에서 그대로 살아 있다.
    recover_enabled: True

    # 진입 조건: 전방에 장애물이 있고(gb_free False) TRAILING 인 상태가
    #            recover_stall_time_sec 동안 연속 지속 + 그 윈도우 동안 실제 이동거리가
    #            recover_stall_travel_m 미만.
    # 전방 장애물 조건이 있어야 출발 직전(정지 상태)이나 사람이 세워 둔 경우에 후진하지 않는다.
    #
    # ★ 2026-08-22: 판정 기준을 "플래너가 해를 못 냈다" -> "차가 실제로 못 갔다" 로 바꿨다.
    #   기존 조건 중 recover_stall_speed_mps(순간속도)와 no_solution(otwpnts 빈 배열)을
    #   빼고, 윈도우 내 순변위 하나로 합쳤다. 근거는 state_machine.py 의 정지 복구 섹션
    #   주석에 A/B 표까지 정리해 두었다. 요약하면 —
    #     · otwpnts 는 정상 주행 중에도 63~89% 가 빈 메시지라 판정 신호가 못 된다.
    #     · 그걸 거르려고 쓰던 splini_ttl 3 s 래치 때문에 교착의 43% 를 놓치고 있었다
    #       (플래너가 쓸모없는 해를 간헐적으로 뱉으면 래치가 계속 갱신된다).
    #     · 이동거리 기준은 "해가 생겨서 차가 움직이기 시작하면 조건이 즉시 깨진다" 라
    #       '곧 해가 나올지' 를 추측할 필요가 없다. 결과로 판정한다.
    #   5개 백(1373 s)에 구현 로직을 그대로 재생한 실측:
    #     설정                    발동  오발동  교착검출   발동지연 med / max
    #     구 규칙(래치3s+정지2s)    10    0%   4/7 (57%)   1.98 / 4.25 s
    #     1.5 s / 0.10 m (현재)    22   36%   6/7 (86%)   1.48 / 1.93 s
    #     2.0 s / 0.10 m           17   24%   6/7 (86%)   1.98 / 2.63 s
    #     1.0 s / 0.10 m           32   44%   6/7 (86%)   0.98 / 1.30 s
    #
    # 헛발(오발동)이 잦으면 여기부터 2.0 으로 올릴 것 — 교착 검출은 그대로 86% 고
    # 오발동만 36% -> 24% 로 준다. 오발동 8건은 전부 발동 후 1.8 s 안에 차가 스스로
    # 나간 경우라, 윈도우를 늘리는 것이 정확히 그 구간을 걷어낸다.
    #
    # ※ 놓친 1건은 문턱 문제가 아니다 — NDT 위치가 정지 상태에서 1.84 m 튄 구간이라
    #   '움직였다' 로 읽혔다(VESC 휠 오도메트리는 같은 구간 변위 0.00 m). 자세한 내용은
    #   state_machine.py 의 정지 복구 섹션 주석 참고.
    recover_stall_time_sec: 1.0    # [s] 판정 윈도우 = 그대로 후진까지의 지연이다

    # 위 윈도우 동안 이만큼도 못 갔으면 '못 가고 있다' 로 본다.
    # 1.5 s 에 0.10 m = 평균 0.067 m/s. 라이다/NDT 위치 노이즈(수 cm)보다 충분히 크고,
    # 기어가듯 전진하는 상태(예: 0.2 m/s -> 1.5 s 에 0.30 m)는 확실히 걸러진다.
    # 왕복해서 제자리로 돌아온 경우도 0 에 가깝게 잡히는데 그건 의도한 동작이다.
    recover_stall_travel_m: 0.10   # [m]

    recover_distance_m: 0.8        # [m] 후진할 거리 (시작 지점에서의 유클리드 변위로 판정)
    recover_speed_mps: 2.0         # [m/s] 후진 명령 속도의 크기 (부호는 코드에서 음수로)
                                   # l1_controller.yaml 의 reverse_speed_max 와 반드시 같이 올릴 것
                                   # (둘 중 작은 쪽이 실효 상한이다)
    recover_timeout_sec: 6.0       # [s] 이 시간이 지나면 거리를 못 채웠어도 후진 종료
    # 후진 시작/종료 직후 0 을 명령하는 시간. VESC 속도(ERPM) 폐루프가 방향을 바꾸기 전에
    # 0 에서 한 번 안정되게 해 급격한 방향 반전 충격을 줄인다.
    recover_dwell_sec: 0.3         # [s]

    # 후진용 로컬 웨이포인트 개수 (중심선 간격 0.1 m). 후진거리 + lookahead 여유를 덮어야 한다.
    recover_n_wpnts: 30            # 4.0 m

    # 기하 검사: 후진 경로상의 중심선 점에서 min(d_left, d_right) 가 이 값보다 커야 한다.
    # 반차폭(0.14) + 여유. 이보다 좁으면 후진을 포기하고 그냥 TRAILING 으로 남는다.
    recover_edge_margin_m: 0.25    # [m]

    # 재무장 규칙(1회만 후진): 한 번 후진하고 나면, 그 지점에서 전방으로 이 거리 이상
    # 실제로 진행하기 전에는 다시 후진하지 않는다. 같은 자리에서 전진<->후진 진동을 막는다.
    recover_rearm_dist_m: 5.0      # [m]

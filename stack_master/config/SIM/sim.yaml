bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'car_state'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom_GT'
    ego_pose_topic: 'pose_GT'
    ego_opp_odom_topic: 'opp_odom'
    # Simulation-only gate consumes controller /drive and only forwards it after
    # RViz 2D Pose Estimate (/initialpose) has reset the vehicle.
    ego_drive_topic: 'sim/drive_to_gym'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'
    ego_imu_topic: 'vesc/sensors/imu/raw'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 1

    # Fallback pose used only before RViz 2D Pose Estimate is received.
    # Vehicle motion remains locked by sim_initialpose_drive_gate until then.
    sx: 0.5
    sy: 1.25
    stheta: -0.7

    # opp starting pose on map
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # teleop
    kb_teleop: True
